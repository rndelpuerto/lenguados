# .github/workflows/deploy-docs.yml
name: Deploy Docusaurus Documentation to GitHub Pages

# ───────────────────────────────────────────────────────────────────────────────
# Trigger:
# - Automatically after the benchmark workflow completes (on main)
# - Manually via workflow_dispatch (deploy without fresh benchmarks)
# ───────────────────────────────────────────────────────────────────────────────
on:
 workflow_run:
  workflows: ['Run Benchmark Suite']
  types:
   - completed
  branches:
   - main
 workflow_dispatch:

# ───────────────────────────────────────────────────────────────────────────────
# Concurrency: Cancel any in-flight deployment when a new one starts.
# ───────────────────────────────────────────────────────────────────────────────
concurrency:
 group: deploy-docs
 cancel-in-progress: false

jobs:
 # ─────────────────────────────────────────────────────────────────────────────
 # Job: build
 # Checkout, download benchmark data, build Docusaurus, upload artifact.
 # ─────────────────────────────────────────────────────────────────────────────
 build:
  name: Build Documentation
  runs-on: ubuntu-latest
  # Run if: bench succeeded, OR manual dispatch, OR not triggered by workflow_run
  if: >-
   github.event_name == 'workflow_dispatch' ||
   github.event.workflow_run.conclusion == 'success'

  permissions:
   contents: read
   id-token: write
   actions: read # Required to download artifacts from other workflows

  steps:
   # ─────────────────────────────────────────────────────────────────────────
   # Checkout
   # ─────────────────────────────────────────────────────────────────────────
   - name: Checkout repository
     uses: actions/checkout@v4
     with:
      fetch-depth: 1

   # ─────────────────────────────────────────────────────────────────────────
   # Setup Environment
   # ─────────────────────────────────────────────────────────────────────────
   - name: Set up Node.js and enable npm cache
     uses: actions/setup-node@v4
     with:
      node-version-file: '.nvmrc'
      cache: npm

   - name: Install monorepo dependencies
     run: npm ci

   # ─────────────────────────────────────────────────────────────────────────
   # Download benchmark summaries from the bench workflow
   # If triggered by workflow_run, download from the triggering run.
   # If triggered manually or benchmarks not available, docs build will
   # show NoDataFallback components on performance pages.
   # ─────────────────────────────────────────────────────────────────────────
   - name: Download benchmark summaries
     if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
     uses: actions/download-artifact@v4
     with:
      name: benchmark-summaries
      path: docs/static/benchmark-data/
      run-id: ${{ github.event.workflow_run.id }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
     continue-on-error: true

   # ─────────────────────────────────────────────────────────────────────────
   # Build Docusaurus site
   # npm run docs runs: generate-docs-data.mjs → generate-package-docs.mjs → docusaurus build
   # If benchmark summaries were downloaded, they're already in place.
   # If not, the generator produces placeholders and pages show fallback UI.
   # ─────────────────────────────────────────────────────────────────────────
   - name: Build Docusaurus site
     run: npm run docs

   # ─────────────────────────────────────────────────────────────────────────
   # Configure and upload for GitHub Pages
   # ─────────────────────────────────────────────────────────────────────────
   - name: Configure GitHub Pages deployment
     uses: actions/configure-pages@v4

   - name: Upload built site as artifact
     uses: actions/upload-pages-artifact@v3
     with:
      path: docs/build

 # ─────────────────────────────────────────────────────────────────────────────
 # Job: deploy
 # Publish to GitHub Pages.
 # ─────────────────────────────────────────────────────────────────────────────
 deploy:
  name: Deploy to GitHub Pages
  needs: build
  runs-on: ubuntu-latest

  permissions:
   pages: write
   id-token: write

  environment:
   name: github-pages
   url: ${{ steps.deploy-pages.outputs.page_url }}

  steps:
   - name: Deploy static site to Pages
     id: deploy-pages
     uses: actions/deploy-pages@v4

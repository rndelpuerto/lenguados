schema: spec-driven

context: |
  # lenguados - Deterministic 2D Physics Engine Math Library

  TypeScript monorepo providing deterministic 2D math primitives for physics engines.
  Guarantees bit-exact cross-platform results for networked game lockstep via fdlibm-based
  polynomial approximations (sin, cos, sqrt, etc.).

  ## Stack
  - Package manager: npm (workspaces + Lerna 9)
  - Node.js: 22.14.0
  - TypeScript: strict mode, exactOptionalPropertyTypes, noUncheckedIndexedAccess
  - Build: Rollup 4 → CJS + ESM + types per package
  - Testing: Jest 29 + ts-jest + fast-check (property-based)
  - Linting: ESLint 9 (flat config) + Stylelint 16 + Prettier 3
  - CI/CD: GitHub Actions (PR validation, release via Lerna, docs deploy)

  ## Monorepo Structure
  - @lenguados/common  → Shared utilities (parseJSONData)
  - @lenguados/math2d  → Core 2D math library (main package, bulk of code)
  - @lenguados/examples → Interactive demos and visual tests
  - docs               → Docusaurus documentation site
  Dependency graph: common ← math2d ← examples

  ## @lenguados/math2d Architecture (layered, dependencies flow down only)
  1. deterministic/ → fdlibm-based sin/cos/sqrt (L0 bit-exact, zero dependencies)
  2. auxiliary/     → Scalar/angle/numeric utilities (uses deterministic/)
  3. core/          → Vector2, Rotation2, Complex, Interval, Matrix2, Matrix3, Transform2
  4. types/         → *Like interfaces (ReadonlyVector2Like, Matrix3Like) for interop
  5. validation/    → Tree-shakeable assertions (stripped in production)
  6. utils/         → Formatting, parsing, random generation, performance measurement

  ## Domain Terms
  - fdlibm: FreeBSD math library providing polynomial coefficients for deterministic trig
  - L0 Determinism: Bit-exact results across all JS engines, OSes, and CPU architectures
  - *Like interfaces: Duck-typed interfaces (ReadonlyVector2Like) accepting POJOs as input
  - *CS variants: Pre-computed cos/sin methods for hot loops (e.g., rotateCS(cos, sin))
  - out parameter: Optional last param to write result into, avoiding heap allocations
  - Strict/Safe/Unchecked triality: Three error-handling tiers per fallible operation
  - apply vs transform: "apply" for operators (Rotation2), "transform" for spatial (Matrix/Transform)
  - Column-major matrices: Storage convention for Matrix2/Matrix3
  - CCW positive: Counter-clockwise rotation is positive angle direction (Y-up)
  - Tree-shakeable validation: Assertions via conditional exports (dev vs production)

  ## Conventions
  - Static methods are pure; instance methods mutate `this` and return `this` for chaining
  - Input params use Readonly*Like; outputs use concrete types
  - out parameter is always the last optional param
  - Angles are always in radians
  - Transform order: Scale → Rotate → Translate
  - Tolerances: EPSILON = 1e-10
  - Tests: *.node.spec.ts for Node env, *.dom.spec.ts for jsdom
  - Test files mirror source structure: src/X/Y.ts → test/X/Y.node.spec.ts
  - Conventional commits enforced via commitlint

  ## Commands
  - Build: npm run build
  - Test: npm run test:unit (without lint) or npm test (with lint)
  - Lint: npm run lint
  - Format: npm run format
  - Single test: npx jest --testPathPattern="path" --no-coverage

rules:
  proposal:
    - Include rollback plan for changes affecting the deterministic guarantees
    - Reference affected layers in the architecture when describing scope
    - Consider impact on tree-shaking and bundle size
  specs:
    - Use Given/When/Then format for behavioral scenarios
    - Include edge cases for NaN, Infinity, and zero-length vectors
    - Specify tolerance requirements for floating-point comparisons
